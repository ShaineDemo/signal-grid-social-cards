name: validate

on:
  push:
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/validate_skill.py .
      - run: npm run render:example
      - run: python scripts/make_contact_sheet.py examples/palette-preview/png examples/palette-preview/contact-sheet.png
      - uses: actions/upload-artifact@v4
        with:
          name: palette-preview
          path: examples/palette-preview/contact-sheet.png
