<!doctype html>
<html lang="zh-CN"><!-- Change to lang="en" for an English card set. -->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signal Grid Social Cards</title>
  <style>
    :root {
      --ink:#171717; --paper:#f2f4fb; --white:#fbfaf6;
      --blue:#315eea; --blue-mid:#5378ee; --blue-soft:#96aceb;
      --orange:#f24b24; --orange-mid:#f76743; --orange-soft:#f3a18a;
      --muted:#a7b5dc; --radius-lg:38px; --radius-md:24px;
      --gap:24px; --safe:64px;
    }
    body.palette-violet-moss {
      --ink:#18151f; --paper:#f1f0f6; --white:#fbfaf6;
      --blue:#6442d7; --blue-mid:#795fe0; --blue-soft:#a591df;
      --orange:#587c00; --orange-mid:#71970b; --orange-soft:#a6be55;
      --muted:#aca3d1;
    }
    body.palette-petrol-raspberry {
      --ink:#15201f; --paper:#edf3f0; --white:#fbfaf6;
      --blue:#006b68; --blue-mid:#17847e; --blue-soft:#72aaa2;
      --orange:#be2f6a; --orange-mid:#d34e82; --orange-soft:#e394b0;
      --muted:#9ab7b1;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; background:var(--ink); color:var(--ink); }
    body { font-family:"Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB",sans-serif; }
    .sheet { display:grid; grid-template-columns:repeat(2,1080px); gap:48px; padding:48px; width:max-content; }
    .poster { position:relative; width:1080px; height:1440px; overflow:hidden; background:var(--paper); }
    body[data-platform="x"] .poster,
    body[data-platform="linkedin"] .poster { height:1350px; }
    .frame { height:100%; padding:var(--safe); display:flex; flex-direction:column; gap:var(--gap); }
    .blue { background:var(--blue); color:var(--white); }
    .orange { background:var(--orange); color:var(--white); }
    .warm { background:var(--white); }
    .topline, .foot { display:flex; align-items:flex-start; justify-content:space-between; gap:24px; }
    .topline { min-height:36px; font-size:26px; line-height:1; font-weight:500; }
    .foot { margin-top:auto; padding-top:20px; border-top:2px solid currentColor; font-size:24px; line-height:1.2; font-weight:500; }
    .kicker { margin:0; font-size:28px; line-height:1.1; font-weight:500; }
    .display { margin:0; font-size:132px; line-height:.92; letter-spacing:-.055em; font-weight:400; }
    .display-cn { margin:0; font-size:118px; line-height:1.02; font-weight:500; }
    .cover-title { margin:0; display:flex; flex-direction:column; align-items:flex-start; }
    .cover-title-emphasis { font-size:144px; line-height:.92; font-weight:500; }
    .cover-title-support { margin-top:18px; font-size:76px; line-height:1.04; font-weight:500; }
    .display-xl { font-size:210px; line-height:.82; font-weight:300; letter-spacing:-.07em; }
    .headline { margin:0; font-size:76px; line-height:1.04; font-weight:500; }
    .body { margin:0; font-size:38px; line-height:1.3; font-weight:400; }
    .meta { font-size:26px; line-height:1.18; font-weight:500; }
    .muted { color:var(--blue-soft); }
    .panel { padding:34px; border-radius:var(--radius-lg); background:var(--white); color:var(--ink); }
    .panel.blue-fill { background:var(--blue); color:var(--white); }
    .panel.orange-fill { background:var(--orange); color:var(--white); }
    .panel.soft-blue { background:var(--blue-soft); color:var(--white); }
    .panel.soft-orange { background:var(--orange-soft); color:var(--white); }
    .matrix { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); }
    .circle { aspect-ratio:1; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:34px; background:var(--blue-mid); color:var(--white); }
    .circle.alt { background:var(--blue-soft); }
    .orange .circle { background:var(--orange-mid); }
    .orange .circle.alt { background:var(--orange-soft); }
    .circle strong { font-size:84px; line-height:.9; font-weight:400; letter-spacing:-.05em; }
    .circle span { margin-top:18px; font-size:28px; line-height:1.12; font-weight:500; }
    .pills { display:flex; flex-direction:column; gap:18px; }
    .pill { min-height:74px; padding:20px 28px; border-radius:18px; display:flex; align-items:center; justify-content:space-between; gap:20px; background:var(--blue); color:var(--white); font-size:32px; line-height:1; font-weight:500; }
    .pill.soft { background:var(--blue-soft); }
    .pill.orange-fill { background:var(--orange); }
    .split { flex:1; display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); min-height:0; }
    .split > * { border-radius:var(--radius-lg); padding:36px; display:flex; flex-direction:column; }
    /* Never use a large value alone. Keep value, unit/object, and context together in .metric. */
    .metric { padding:34px; border-radius:var(--radius-lg); display:flex; flex-direction:column; gap:22px; background:var(--blue); color:var(--white); }
    .metric-line { display:flex; align-items:flex-end; gap:18px; }
    .metric-value { font-size:170px; line-height:.82; font-weight:300; letter-spacing:-.07em; }
    .metric-unit { padding-bottom:10px; font-size:38px; line-height:1.05; font-weight:500; }
    .metric-caption { font-size:30px; line-height:1.2; font-weight:500; }
    .metric-list { display:flex; flex-direction:column; gap:10px; font-size:28px; line-height:1.12; font-weight:500; }
    .metric-list span { padding-top:10px; border-top:1px solid currentColor; }
    .rule { height:2px; background:currentColor; opacity:.7; }
    .tag-row { display:flex; flex-wrap:wrap; gap:14px; }
    .tag { padding:14px 20px; border-radius:14px; background:var(--blue-soft); color:var(--white); font-size:25px; line-height:1; font-weight:500; }
    .tag.active { background:var(--blue); }
    .mini-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:var(--gap); }
    .mini { min-height:180px; border-radius:var(--radius-md); padding:28px; background:var(--blue-soft); color:var(--white); display:flex; flex-direction:column; justify-content:space-between; }
    .mini strong { font-size:64px; line-height:1; font-weight:400; }
    .mini span { font-size:27px; line-height:1.16; font-weight:500; }
    .brand-lockup { display:flex; align-items:center; gap:22px; }
    .brand-tile { width:180px; height:180px; border-radius:var(--radius-lg); background:var(--white); display:flex; align-items:center; justify-content:center; padding:28px; }
    .brand-tile img { display:block; width:100%; height:100%; object-fit:contain; }
    .brand-join { font-size:72px; line-height:1; font-weight:300; }
    .portrait-tile { overflow:hidden; border-radius:var(--radius-lg); background:var(--blue-soft); }
    .portrait-tile img { display:block; width:100%; height:100%; object-fit:cover; }
    .spacer { flex:1; }
  </style>
</head>
<body data-platform="xiaohongshu" data-topic-subject="BRAND" data-cover-asset="none">
  <main class="sheet">
    <!-- Large numerals belong inside .metric with a visible unit/object and context. Never place .metric-value alone. -->
    <!-- Replace this placeholder with one .poster section per card. -->
    <section class="poster blue" id="card-01" data-filename="01-cover.png" data-page-grammar="cover-grid">
      <div class="frame">
        <div class="topline"><span>SIGNAL GRID</span><span>01 / 01</span></div>
        <div class="spacer"></div>
        <p class="kicker">TOPIC / DATE</p>
        <h1 class="cover-title"><span class="cover-title-emphasis" data-role="recognition-anchor">BRAND</span><span class="cover-title-support" data-role="support-title">事件与变化说明</span></h1>
        <div class="foot"><span>ONE CLEAR TAKEAWAY</span><span>→</span></div>
      </div>
    </section>
  </main>
</body>
</html>
